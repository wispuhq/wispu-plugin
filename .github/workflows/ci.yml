name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tool-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tool names, arguments and internal terms
        run: node scripts/check-tool-names.mjs
